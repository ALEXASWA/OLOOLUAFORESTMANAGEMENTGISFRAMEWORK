{% load static %}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}FGMDSS{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10.2.1/ol.css">
<link rel="stylesheet" href="{% static 'css/app.css' %}">
{% block head %}{% endblock %}
</head>
<body>
<nav class="navbar navbar-dark bg-dark px-3">
<a class="navbar-brand" href="/">FGMDSS</a>
<div class="d-flex gap-3">
<a class="text-white" href="/">Dashboard</a><a class="text-white" href="/gis/">Web GIS</a><a class="text-white" href="/lulc/">LULC</a><a class="text-white" href="/admin/">Admin</a>
{% if user.is_authenticated %}<span class="text-white">{{ user.username }}</span>{% endif %}
</div>
</nav>
<main class="container-fluid py-3">{% block content %}{% endblock %}</main>
</body>
</html>
